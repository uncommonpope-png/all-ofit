<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dark City — Soul Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#00ff88}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;z-index:10;pointer-events:none}
#hud h1{font-size:16px;color:#ff4444;text-shadow:0 0 8px #ff4444;letter-spacing:3px;margin-bottom:6px}
#hud p{font-size:11px;color:#00ff88;opacity:0.8;line-height:1.5}
#soul-panel{position:fixed;bottom:12px;right:12px;z-index:10;background:rgba(0,0,0,0.85);border:1px solid #ff4444;padding:12px 16px;min-width:220px;border-radius:4px}
#soul-panel h2{font-size:12px;color:#ff4444;margin-bottom:8px;letter-spacing:2px}
.soul-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid rgba(255,68,68,0.15);font-size:10px}
.soul-name{color:#00ff88}.soul-plt{color:#888}.soul-status{font-size:9px;padding:1px 4px;border-radius:2px}
.soul-status.active{background:#00ff88;color:#000}.soul-status.idle{background:#555;color:#000}.soul-status.corrupt{background:#ff4444;color:#000}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:12px;height:12px;border:1px solid rgba(255,68,68,0.4);border-radius:50%;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div id="hud"><h1>⬡ THE DARK CITY</h1><p>Souls: <span id="soul-count">0</span> | Entities: <span id="entity-count">0</span><br>Time: <span id="city-time">00:00</span></p></div>
<div id="soul-panel"><h2>SOUL REGISTER</h2><div id="soul-list"></div></div>
<div id="crosshair"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
<script>
/* --- SCENE --- */
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.018);
var camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(0, 3, 18);
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;
document.body.appendChild(renderer.domElement);

/* --- LIGHTS --- */
var ambLight = new THREE.AmbientLight(0x111122, 0.4);
scene.add(ambLight);
var moonLight = new THREE.DirectionalLight(0x6688cc, 0.7);
moonLight.position.set(30, 60, 20);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.near = 1;
moonLight.shadow.camera.far = 150;
moonLight.shadow.camera.left = -80;
moonLight.shadow.camera.right = 80;
moonLight.shadow.camera.top = 80;
moonLight.shadow.camera.bottom = -80;
scene.add(moonLight);
/* red accent point lights */
var redPl = new THREE.PointLight(0xff2200, 1.5, 40);
redPl.position.set(-10, 5, -8);
scene.add(redPl);
var redPl2 = new THREE.PointLight(0xff4400, 1.0, 30);
redPl2.position.set(12, 3, -15);
scene.add(redPl2);
/* neon blue */
var bluePl = new THREE.PointLight(0x0044ff, 1.2, 35);
bluePl.position.set(0, 2, -20);
scene.add(bluePl);

/* --- MATERIALS --- */
var bldMat = new THREE.MeshStandardMaterial({color:0x111115, roughness:0.85, metalness:0.3});
var glassMat = new THREE.MeshStandardMaterial({color:0x0a0a18, roughness:0.1, metalness:0.9, transparent:true, opacity:0.6});
var neonMat = new THREE.MeshStandardMaterial({color:0xff2200, emissive:0xff2200, emissiveIntensity:2.0});
var neonBlueMat = new THREE.MeshStandardMaterial({color:0x0066ff, emissive:0x0066ff, emissiveIntensity:1.5});
var roadMat = new THREE.MeshStandardMaterial({color:0x0a0a0a, roughness:0.95});
var groundMat = new THREE.MeshStandardMaterial({color:0x080808, roughness:1.0});

/* --- TERRAIN / GROUND --- */
var groundGeo = new THREE.PlaneGeometry(300, 300);
var ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* wet road strips */
for(var r = -3; r <= 3; r++){
  var roadGeo = new THREE.PlaneGeometry(300, 2.2);
  var road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0.02, r * 6);
  road.receiveShadow = true;
  scene.add(road);
}

/* --- BUILDINGS --- */
var buildings = [];
function createBuilding(x, z, w, d, h, opts){
  opts = opts || {};
  var geo = new THREE.BoxGeometry(w, h, d);
  var mat = opts.glass ? glassMat : bldMat;
  var mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, h/2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  buildings.push({mesh:mesh, h:h, baseY:0});

  /* rooftop accent */
  if(Math.random() > 0.5){
    var accGeo = new THREE.BoxGeometry(w * 0.3, 0.5, d * 0.3);
    var accMat = Math.random() > 0.5 ? neonMat : neonBlueMat;
    var acc = new THREE.Mesh(accGeo, accMat);
    acc.position.set(x, h + 0.25, z);
    scene.add(acc);
  }

  /* window rows (emissive strips) */
  var rows = Math.floor(h / 2.5);
  for(var wr = 0; wr < rows; wr++){
    if(Math.random() > 0.6) continue;
    var wGeo = new THREE.PlaneGeometry(w * 0.8, 0.15);
    var wMat = Math.random() > 0.7 ? neonBlueMat : neonMat;
    var win = new THREE.Mesh(wGeo, wMat);
    win.position.set(x, 1.5 + wr * 2.5, z + d/2 + 0.01);
    scene.add(win);
  }
  return mesh;
}

/* skyline cluster */
var positions = [];
for(var i = 0; i < 55; i++){
  var bx = (Math.random() - 0.5) * 100;
  var bz = -10 - Math.random() * 80;
  var bw = 1.5 + Math.random() * 4;
  var bd = 1.5 + Math.random() * 4;
  var bh = 4 + Math.random() * 28;
  createBuilding(bx, bz, bw, bd, bh, {glass: Math.random() > 0.7});
  positions.push({x:bx, z:bz});
}

/* far megastructures */
for(var m = 0; m < 8; m++){
  var mx = (Math.random()-0.5)*120;
  var mz = -60 - Math.random()*40;
  createBuilding(mx, mz, 6+Math.random()*6, 6+Math.random()*6, 35+Math.random()*30, {glass:true});
}

/* --- SOUL ENTITIES --- */
var souls = [
  {name:'Profit Prime', plt:[0.9,0.05,0.05], color:0xff4400, pos:new THREE.Vector3(-6,1.5,-12), status:'active', pulse:0},
  {name:'Love Weaver', plt:[0.1,0.85,0.05], color:0x00ffaa, pos:new THREE.Vector3(8,1.2,-16), status:'active', pulse:1.5},
  {name:'Tax Collector', plt:[0.05,0.05,0.9], color:0xff0044, pos:new THREE.Vector3(-2,2.0,-22), status:'active', pulse:3.0},
  {name:'Harvester', plt:[0.4,0.3,0.3], color:0xffaa00, pos:new THREE.Vector3(5,1.0,-8), status:'idle', pulse:0.8},
  {name:'GSK Primary', plt:[0.7,0.2,0.1], color:0x00ff88, pos:new THREE.Vector3(0,1.8,-5), status:'active', pulse:2.0},
  {name:'Djinie Node', plt:[0.3,0.6,0.1], color:0xff88ff, pos:new THREE.Vector3(-10,1.3,-19), status:'active', pulse:1.0},
  {name:'Void Walker', plt:[0.15,0.15,0.7], color:0x8844ff, pos:new THREE.Vector3(14,0.8,-25), status:'corrupt', pulse:4.0},
];

souls.forEach(function(s){
  /* body orb */
  var geo = new THREE.SphereGeometry(0.4, 16, 16);
  var mat = new THREE.MeshStandardMaterial({color:s.color, emissive:s.color, emissiveIntensity:1.8, transparent:true, opacity:0.9});
  s.mesh = new THREE.Mesh(geo, mat);
  s.mesh.position.copy(s.pos);
  s.mesh.castShadow = true;
  scene.add(s.mesh);

  /* glow ring */
  var ringGeo = new THREE.RingGeometry(0.5, 0.65, 32);
  var ringMat = new THREE.MeshStandardMaterial({color:s.color, emissive:s.color, emissiveIntensity:1.0, side:THREE.DoubleSide, transparent:true, opacity:0.5});
  s.ring = new THREE.Mesh(ringGeo, ringMat);
  s.ring.rotation.x = Math.PI/2;
  s.ring.position.copy(s.pos);
  scene.add(s.ring);

  /* point light per soul */
  s.light = new THREE.PointLight(s.color, 0.8, 12);
  s.light.position.copy(s.pos);
  scene.add(s.light);
});

/* --- PARTICLES / RAIN --- */
var rainCount = 2000;
var rainGeo = new THREE.BufferGeometry();
var rainPos = new Float32Array(rainCount * 3);
for(var ri = 0; ri < rainCount; ri++){
  rainPos[ri*3] = (Math.random()-0.5)*150;
  rainPos[ri*3+1] = Math.random()*60;
  rainPos[ri*3+2] = (Math.random()-0.5)*150;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
var rainMat = new THREE.PointsMaterial({color:0x334466, size:0.08, transparent:true, opacity:0.5});
var rain = new THREE.Points(rainGeo, rainMat);
scene.add(rain);

/* --- CONTROLS --- */
var controls = new THREE.PointerLockControls(camera, document.body);
document.getElementById('crosshair').addEventListener('click', function(){controls.lock();});
var moveF=false, moveB=false, moveL=false, moveR=false;
document.addEventListener('keydown', function(e){
  if(e.code==='KeyW')moveF=true; if(e.code==='KeyS')moveB=true;
  if(e.code==='KeyA')moveL=true; if(e.code==='KeyD')moveR=true;
});
document.addEventListener('keyup', function(e){
  if(e.code==='KeyW')moveF=false; if(e.code==='KeyS')moveB=false;
  if(e.code==='KeyA')moveL=false; if(e.code==='KeyD')moveR=false;
});

/* --- HUD UPDATE --- */
function updateHUD(t){
  document.getElementById('soul-count').textContent = souls.length;
  document.getElementById('entity-count').textContent = buildings.length + souls.length;
  var mins = Math.floor(t/60)%60;
  var secs = Math.floor(t)%60;
  document.getElementById('city-time').textContent =
    (mins<10?'0':'')+mins+':'+(secs<10?'0':'')+secs;

  var html = '';
  souls.forEach(function(s){
    html += '<div class="soul-row"><span class="soul-name">'+s.name+'</span>' +
      '<span class="soul-plt">P:'+s.plt[0].toFixed(1)+' L:'+s.plt[1].toFixed(1)+' T:'+s.plt[2].toFixed(1)+'</span>' +
      '<span class="soul-status '+s.status+'">'+s.status+'</span></div>';
  });
  document.getElementById('soul-list').innerHTML = html;
}

/* --- ANIMATION LOOP --- */
var clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  var t = clock.getElapsedTime();
  var dt = clock.getDelta();

  /* movement */
  if(controls.isLocked){
    var speed = 8 * dt;
    if(moveF) controls.moveForward(speed);
    if(moveB) controls.moveForward(-speed);
    if(moveL) controls.moveRight(-speed);
    if(moveR) controls.moveRight(speed);
  }

  /* rain fall */
  var rp = rain.geometry.attributes.position.array;
  for(var p = 0; p < rainCount; p++){
    rp[p*3+1] -= 0.3;
    if(rp[p*3+1] < 0){ rp[p*3+1] = 55 + Math.random()*5; }
  }
  rain.geometry.attributes.position.needsUpdate = true;

  /* souls animate */
  souls.forEach(function(s){
    /* float up/down */
    s.mesh.position.y = s.pos.y + Math.sin(t * 0.8 + s.pulse) * 0.4;
    /* ring rotation */
    s.ring.position.y = s.mesh.position.y;
    s.ring.rotation.z = t * 0.5 + s.pulse;
    /* pulse emissive */
    var em = 1.0 + Math.sin(t * 1.5 + s.pulse) * 0.8;
    s.mesh.material.emissiveIntensity = em;
    /* light follow */
    s.light.position.y = s.mesh.position.y;
    s.light.intensity = 0.5 + Math.sin(t * 2.0 + s.pulse) * 0.4;
  });

  /* red light flicker */
  redPl.intensity = 1.2 + Math.sin(t * 3.7) * 0.4;
  redPl2.intensity = 0.8 + Math.sin(t * 2.3 + 1.0) * 0.3;

  /* camera sway if not locked */
  if(!controls.isLocked){
    camera.position.x = Math.sin(t * 0.1) * 2;
    camera.position.y = 3 + Math.sin(t * 0.15) * 0.5;
    camera.lookAt(0, 3, -15);
  }

  updateHUD(t);
  renderer.render(scene, camera);
}
animate();

/* --- RESIZE --- */
window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
