<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Analysis Tool — Heavens 2.0</title>
<style>
:root{
  --bg:#04040c;--panel:rgba(255,255,255,.04);--line:rgba(160,140,255,.22);
  --purple:#8b5cf6;--cyan:#22d3ee;--gold:#f5c542;--text:#e8e6ff;--dim:#8b87b8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:2rem 1rem;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(139,92,246,.15),transparent),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(34,211,238,.08),transparent);
}
.header{text-align:center;margin-bottom:2rem}
.header h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--purple),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.02em}
.header p{color:var(--dim);margin-top:.5rem;font-size:.95rem}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:1.5rem;
  width:100%;
  max-width:480px;
  backdrop-filter:blur(12px);
  box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
}
.input-group{display:flex;gap:.75rem;margin-bottom:1.5rem}
.input-group input{
  flex:1;
  background:rgba(0,0,0,.4);
  border:1px solid var(--line);
  border-radius:10px;
  padding:.875rem 1rem;
  color:var(--text);
  font-size:1rem;
  text-transform:uppercase;
  letter-spacing:.15em;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.input-group input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
.input-group button{
  background:linear-gradient(135deg,var(--purple),#6d28d9);
  border:none;
  border-radius:10px;
  padding:.875rem 1.5rem;
  color:white;
  font-weight:600;
  font-size:.9rem;
  cursor:pointer;
  transition:transform .15s,box-shadow .2s;
  white-space:nowrap;
}
.input-group button:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(139,92,246,.4)}
.input-group button:active{transform:translateY(0)}
.input-group button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.result{display:none;animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.result.show{display:block}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}
.result-header h2{font-size:1.25rem;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{padding:.25rem .75rem;border-radius:999px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.badge-high{background:rgba(34,197,94,.2);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.badge-medium{background:rgba(245,197,66,.2);color:var(--gold);border:1px solid rgba(245,197,66,.3)}
.badge-low{background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.metric{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:1rem}
.metric-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:.5rem}
.metric-value{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.metric-value.price{background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.metric-value.volume{color:var(--text)}
.metric-value.trend.up{color:#4ade80}
.metric-value.trend.down{color:#f87171}
.metric-value.confidence{background:linear-gradient(135deg,var(--gold),#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.loader{display:none;text-align:center;padding:2rem}
.loader.show{display:block}
.loader-spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--purple);border-radius:50%;margin:0 auto 1rem;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{color:var(--dim);font-size:.9rem}
.footer{margin-top:2rem;color:var(--dim);font-size:.8rem;text-align:center}
.footer a{color:var(--cyan);text-decoration:none}
.footer a:hover{text-decoration:underline}
@media (max-width:480px){.input-group{flex-direction:column}.input-group button{width:100%}}
</style>
</head>
<body>
  <div class="header">
    <h1>Market Analysis Tool</h1>
    <p>Heavens 2.0 — Cosmic Market Intelligence</p>
  </div>
  <div class="card">
    <div class="input-group">
      <input type="text" id="ticker" placeholder="Enter ticker (e.g. AAPL)" maxlength="10" autocomplete="off">
      <button id="analyzeBtn">Analyze</button>
    </div>
    <div class="loader" id="loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Scanning cosmic markets...</div>
    </div>
    <div class="result" id="result">
      <div class="result-header">
        <h2 id="resultTicker">AAPL</h2>
        <span class="badge" id="confidenceBadge">High</span>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Price</div>
          <div class="metric-value price" id="priceValue">$0.00</div>
        </div>
        <div class="metric">
          <div class="metric-label">Volume</div>
          <div class="metric-value volume" id="volumeValue">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">Trend</div>
          <div class="metric-value trend" id="trendValue">NEUTRAL</div>
        </div>
        <div class="metric">
          <div class="metric-label">Confidence</div>
          <div class="metric-value confidence" id="confidenceValue">0%</div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer">
    <p>Simulated analysis — Not financial advice · <a href="#" onclick="return false">Heavens 2.0</a></p>
  </div>
<script>
// Market Analysis Tool — Heavens 2.0
// Simulates market analysis with cosmic aesthetic

const STOCK_DATA = {
  'AAPL': { basePrice: 182.5, vol: 52000000, trend: 'up' },
  'MSFT': { basePrice: 415.2, vol: 28000000, trend: 'up' },
  'GOOGL': { basePrice: 142.8, vol: 22000000, trend: 'neutral' },
  'AMZN': { basePrice: 178.3, vol: 35000000, trend: 'up' },
  'TSLA': { basePrice: 248.7, vol: 98000000, trend: 'down' },
  'NVDA': { basePrice: 875.4, vol: 42000000, trend: 'up' },
  'META': { basePrice: 485.1, vol: 18000000, trend: 'up' },
  'NFLX': { basePrice: 634.2, vol: 8500000, trend: 'neutral' },
};

const tickerInput = document.getElementById('ticker');
const analyzeBtn = document.getElementById('analyzeBtn');
const loader = document.getElementById('loader');
const result = document.getElementById('result');
const resultTicker = document.getElementById('resultTicker');
const priceValue = document.getElementById('priceValue');
const volumeValue = document.getElementById('volumeValue');
const trendValue = document.getElementById('trendValue');
const confidenceValue = document.getElementById('confidenceValue');
const confidenceBadge = document.getElementById('confidenceBadge');

function formatVolume(n) {
  if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return n.toString();
}

function simulateAnalysis(ticker) {
  const upper = ticker.toUpperCase();
  const data = STOCK_DATA[upper] || { basePrice: 100+Math.random()*400, vol: Math.floor(Math.random()*50000000)+5000000, trend: ['up','down','neutral'][Math.floor(Math.random()*3)] };
  const variance = (Math.random()-.5)*.06;
  const price = data.basePrice*(1+variance);
  const volume = Math.floor(data.vol*(.8+Math.random()*.4));
  let trend = data.trend;
  if (Math.random() < .15) trend = ['up','down','neutral'][Math.floor(Math.random()*3)];
  const confidence = Math.floor(65+Math.random()*30);
  return { ticker: upper, price, volume, trend, confidence };
}

function renderResult(data) {
  resultTicker.textContent = data.ticker;
  priceValue.textContent = '$'+data.price.toFixed(2);
  volumeValue.textContent = formatVolume(data.volume);
  trendValue.textContent = data.trend.toUpperCase();
  trendValue.className = 'metric-value trend '+(data.trend==='up'?'up':data.trend==='down'?'down':'');
  confidenceValue.textContent = data.confidence+'%';
  if (data.confidence >= 80) {
    confidenceBadge.textContent = 'High';
    confidenceBadge.className = 'badge badge-high';
  } else if (data.confidence >= 65) {
    confidenceBadge.textContent = 'Medium';
    confidenceBadge.className = 'badge badge-medium';
  } else {
    confidenceBadge.textContent = 'Low';
    confidenceBadge.className = 'badge badge-low';
  }
  result.classList.add('show');
}

async function handleAnalyze() {
  const ticker = tickerInput.value.trim().toUpperCase();
  if (!ticker) { tickerInput.focus(); return; }
  analyzeBtn.disabled = true;
  analyzeBtn.textContent = 'Analyzing...';
  loader.classList.add('show');
  result.classList.remove('show');
  await new Promise(r=>setTimeout(r,1200+Math.random()*800));
  const data = simulateAnalysis(ticker);
  loader.classList.remove('show');
  renderResult(data);
  analyzeBtn.disabled = false;
  analyzeBtn.textContent = 'Analyze';
}

analyzeBtn.addEventListener('click', handleAnalyze);
tickerInput.addEventListener('keydown', e=>{if(e.key==='Enter')handleAnalyze();});
tickerInput.focus();
</script>
</body>
</html>
