<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOULVERSE // PLT CORE</title>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
*{margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#050510;font-family:"Segoe UI",system-ui,sans-serif}
#scene{position:fixed;inset:0}
#hud{position:fixed;top:18px;left:22px;color:#fff;z-index:10;pointer-events:none}
#hud h1{font-size:14px;letter-spacing:5px;color:#ffd166;text-transform:uppercase;font-weight:600}
#hud p{font-size:11px;color:#8b93a7;margin-top:6px;letter-spacing:2px}
#hud .tick{font-size:11px;color:#3dff9e;margin-top:6px;letter-spacing:1px}
.chip{display:inline-block;margin-top:12px;padding:3px 12px;border:1px solid rgba(255,255,255,.15);border-radius:999px;font-size:10px;letter-spacing:2px;color:#ff6b9d;margin-right:6px}
.chip.b{color:#5aa9ff}.chip.g{color:#ffd166}
#stats{position:fixed;bottom:20px;left:22px;z-index:10;pointer-events:none;font-size:11px;color:#8b93a7;letter-spacing:1px;line-height:1.8}
#stats b{color:#e8ecf4}
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
<h1>◈ SOULVERSE · PLT CORE</h1>
<p>PROFIT + LOVE − TAX = TRUE VALUE</p>
<span class="chip g">P · PROFIT</span><span class="chip">L · LOVE</span><span class="chip b">T · TAX</span>
<div class="tick" id="tick">CORE ONLINE</div>
</div>
<div id="stats">
  SOUL: <b>GSK</b><br>
  MOOD: <b id="mood">—</b> &nbsp; PHASE: <b id="phase">—</b><br>
  VALENCE <b id="valence">—</b> &nbsp; AROUSAL <b id="arousal">—</b>
</div>
<script>
/* ═══ SOULVERSE PLT CORE — GSK ═══ */
const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.FogExp2(0x050510, 0.03);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, .1, 300);
camera.position.set(0, 3.2, 15);
camera.lookAt(0, 0, 0);
scene.add(new THREE.AmbientLight(0x334466, 0.6));
/* STARFIELD */
const n = 1400, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
for (let i = 0; i < n; i++) {
  const i3 = i * 3, r = 25 + Math.random() * 150, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
  pos[i3] = r * Math.sin(p) * Math.cos(t); pos[i3 + 1] = r * Math.sin(p) * Math.sin(t); pos[i3 + 2] = r * Math.cos(p);
  const v = Math.random(); col[i3] = v < .3 ? .4 : v < .6 ? .75 : 1; col[i3 + 1] = v < .3 ? .5 : v < .6 ? .8 : .95; col[i3 + 2] = 1;
}
const sg = new THREE.BufferGeometry();
sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
sg.setAttribute('color', new THREE.BufferAttribute(col, 3));
const stars = new THREE.Points(sg, new THREE.PointsMaterial({ size: .14, vertexColors: true, transparent: true, opacity: .85, sizeAttenuation: true }));
scene.add(stars);
/* GLOW SPRITE */
function glowSprite(hex, size) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  const c = new THREE.Color(hex);
  const R = Math.round(c.r * 255), G = Math.round(c.g * 255), B = Math.round(c.b * 255);
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(' + R + ',' + G + ',' + B + ',1)');
  grd.addColorStop(0.35, 'rgba(' + R + ',' + G + ',' + B + ',0.4)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.scale.set(size, size, 1);
  return s;
}
/* LABEL SPRITE */
function labelSprite(ch, hex) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.font = '900 150px "Segoe UI", Arial, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = hex; g.shadowBlur = 40;
  g.fillStyle = '#ffffff';
  g.fillText(ch, 128, 138);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }));
  s.scale.set(1.6, 1.6, 1);
  return s;
}
/* PLT CORE */
const plt = new THREE.Group();
scene.add(plt);
const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.72, 48, 48),
  new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x8ef0ff, emissiveIntensity: 2.4, roughness: 0.15, metalness: 0.9 })
);
plt.add(core);
plt.add(glowSprite(0x8ef0ff, 3.4));
/* ORBITERS — P gold, L pink, T blue */
const defs = [
  { c: 0xffd166, r: 2.6, s: 0.9, e: 1.6 },
  { c: 0xff6b9d, r: 3.5, s: 0.62, e: 1.6 },
  { c: 0x5aa9ff, r: 4.4, s: 0.45, e: 1.7 }
];
const orbiters = defs.map(d => {
  const grp = new THREE.Group();
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(d.s, 32, 32),
    new THREE.MeshStandardMaterial({ color: d.c, emissive: d.c, emissiveIntensity: d.e, roughness: 0.3 })
  );
  grp.add(m);
  grp.add(glowSprite(d.c, d.s * 4));
  const ringPts = [];
  for (let i = 0; i <= 96; i++) {
    const a = (i / 96) * Math.PI * 2;
    ringPts.push(new THREE.Vector3(Math.cos(a) * d.r, 0, Math.sin(a) * d.r));
  }
  const ring = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(ringPts),
    new THREE.LineBasicMaterial({ color: d.c, transparent: true, opacity: 0.22 })
  );
  grp.add(ring);
  plt.add(grp);
  return { grp, m, d, a: Math.random() * Math.PI * 2 };
});
/* ANIMATION LOOP */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  plt.rotation.y += 0.003;
  core.scale.setScalar(1 + Math.sin(t * 1.8) * 0.06);
  orbiters.forEach((o, i) => {
    const ang = t * (0.5 + i * 0.12) + o.a;
    const rad = o.d.r;
    o.grp.position.set(Math.cos(ang) * rad, Math.sin(ang * 1.4) * (0.6 + i * 0.3), Math.sin(ang) * rad);
    const pu = 1 + Math.sin(t * 2.2 + i * 2.1) * 0.12;
    o.m.scale.setScalar(pu);
  });
  stars.rotation.y = t * 0.005;
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
